# ─────────────────────────────────────────────────────────────
#  OpsPilot AI — Production Nginx Reverse Proxy Configuration
#  Domain: opspilot.ai / api.opspilot.ai
# ─────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# Upstream definitions
upstream backend_cluster {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream frontend_cluster {
    server frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ── HTTP (Port 80) — Automatic HTTPS Redirect ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name opspilot.ai www.opspilot.ai api.opspilot.ai localhost;

    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (Port 443) — Main SaaS Dashboard & API Proxy ───────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opspilot.ai www.opspilot.ai localhost;

    # SSL / TLS Certificates
    ssl_certificate /etc/nginx/certs/opspilot.crt;
    ssl_certificate_key /etc/nginx/certs/opspilot.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Concurrency limit per IP
    limit_conn addr_limit 50;

    # ── API Gateway Routing (/v1) ───────────────────────────
    location /v1/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend_cluster/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        # Real-time SSE Log Streaming Configuration
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── Auth Endpoints Rate Limiting ────────────────────────
    location /v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend_cluster/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Frontend Next.js Single Page Application ─────────────
    location / {
        proxy_pass http://frontend_cluster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
