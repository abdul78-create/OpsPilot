server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff font/woff2;
    gzip_min_length 256;

    # Next.js static assets
    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Non-integer run IDs (run_* timestamps or UUIDs): serve shell page
    # Matches /runs/<anything containing underscore or hyphen>
    location ~ ^/runs/[^/]*[_\-][^/]* {
        try_files $uri $uri.html /runs/shell.html /index.html;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }

    # Next.js export routes
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }

    # Proxy API calls to NestJS backend
    location /v1/ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # SSE stream for real-time logs
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
