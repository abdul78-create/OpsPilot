server {
    listen 80;
    listen [::]:80;
    listen 10000;
    listen [::]:10000;
    server_name _;

    # Disable absolute redirects and internal port exposure behind reverse proxies (Render / Cloudflare)
    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;
    error_page 404 /404.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff font/woff2;
    gzip_min_length 256;

    # Next.js static assets
    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dynamic pipeline run details (real UUIDs or dynamic IDs): serve run detail shell
    # Matches /runs/<runId> or /runs/<runId>/ while excluding bare /runs or /runs/
    location ~ ^/runs/[^/]+/?$ {
        try_files $uri $uri/ /runs/shell/index.html;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }

    # Next.js export routes (SPA fallback to index.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }
}
