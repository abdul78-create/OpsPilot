services:
  # ── NestJS API ───────────────────────────────────────────────
  - type: web
    name: opspilot-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm run start:prod
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: opspilot-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_PATH
        value: api/docs

  # ── Redis ─────────────────────────────────────────────────────
  - type: redis
    name: opspilot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction

databases:
  # ── PostgreSQL ────────────────────────────────────────────────
  - name: opspilot-db
    region: oregon
    plan: free
    databaseName: opspilot
    user: opspilot
